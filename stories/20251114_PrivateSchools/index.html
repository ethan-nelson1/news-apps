<!DOCTYPE html>
<html lang="en">
<head>
    <title>Twin Cities Private Schools</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }

        /* Popup styling */
        .maplibregl-popup-content {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 16px 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            color: #22223b;
        }
        .maplibregl-popup-content h2 {
            margin: 0 0 8px 0;
            font-size: 1.1em;
            color: #6a51a3;
        }
        .maplibregl-popup-content p {
            margin: 0;
            font-size: 1em;
            color: #22223b;
        }

        /* Legend styling */
        .legend {
            position: absolute;
            top: 18px;
            left: 18px;
            background: rgba(255,255,255,0.95);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 16px 20px 14px 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 1em;
            z-index: 1;
            min-width: 210px;
            font-family: 'Playfair Display', serif;
        }
        .legend-title {
            font-weight: bolder;
            color: #232946;
            margin-bottom: 10px;
            font-size: 1.55em;
            letter-spacing: 0.01em;
        }
        .legend-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 7px;
        }
        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-right: 12px;
            border: 1.5px solid #000;
            flex-shrink: 0;
        }
        .legend-low { background: #f2f0f7; }
        .legend-medlow { background: #cbc9e2; }
        .legend-medhigh { background: #9e9ac8; }
        .legend-high { background: #6a51a3; }
        .top-controls {
            position: absolute;
            top: 18px;
            right: 0px;
            z-index: 2;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .top-controls input,
        .top-controls button {
            padding: 8px 6px;
            font-size: 1em;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
        }

        #suggestions {
            list-style: none;
            margin: 0;
            padding: 0;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: none;
            position: absolute;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            .top-controls {
            flex-direction: column;
            align-items: stretch;
            right: 6px;
            top: 12px;
            }

            .top-controls input,
            .top-controls button {
            width: 100%;
            }
        }

    </style>
</head>
<body>


<div class="top-controls">
  <div style="position: relative; width: 100%;">
    <input id="searchBox" type="text" placeholder="Search schools..." />
    <ul id="suggestions"></ul>
  </div>
  <button id="resetBtn">Reset Map</button>
</div>


<div id="map"></div>

<!-- Legend HTML -->
<div class="legend">
    <div class="legend-title">MAX TUITION</div>
    <ul class="legend-list">
        <li class="legend-item"><span class="legend-color legend-low"></span>Less than $6,000</li>
        <li class="legend-item"><span class="legend-color legend-medlow"></span>$6,000 – $10,000</li>
        <li class="legend-item"><span class="legend-color legend-medhigh"></span>$10,000 – $16,000</li>
        <li class="legend-item"><span class="legend-color legend-high"></span>Greater than $16,000</li>
    </ul>
</div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://api.maptiler.com/maps/0199c5c6-07ba-7b0b-ac48-b658ede2f451/style.json?key=Y3lPBbbj1aya0WF8hqJk',
        center: [-93.21825738862282, 44.96882264809478],
        zoom: 9
    });

    map.on('load', async () => {


        map.addSource('schools', {
                'type': 'geojson',
                'data': 'schools.geojson'
            });

        map.addLayer({
            'id': 'school-low',
            'type': 'circle',
            'source': 'schools',
            'paint': {
                'circle-color': '#f2f0f7',
                'circle-opacity': 1,
                'circle-stroke-color': '#000000',
                'circle-stroke-width': .74
            },
            'filter': ['<', 'max_tuition', 6000]
        });

        map.addLayer({
            'id': 'school-med-low',
            'type': 'circle',
            'source': 'schools',
            'paint': {
                'circle-color': '#cbc9e2',
                'circle-opacity': 1,
                'circle-stroke-color': '#000000',
                'circle-stroke-width': .74
            },
            'filter': [
                'all',
                ['>=', 'max_tuition', 6001],
                ['<=', 'max_tuition', 10000]
            ]
        });

        map.addLayer({
            'id': 'school-med-high',
            'type': 'circle',
            'source': 'schools',
            'paint': {
                'circle-color': '#9e9ac8',
                'circle-opacity': 1,
                'circle-stroke-color': '#000000',
                'circle-stroke-width': .74
            },
            'filter': [
                'all',
                ['>=', 'max_tuition', 10001],
                ['<=', 'max_tuition', 16000]
            ]
        });
        map.addLayer({
            'id': 'school-high',
            'type': 'circle',
            'source': 'schools',
            'paint': {
                'circle-color': '#6a51a3',
                'circle-opacity': 1,
                'circle-stroke-color': '#000000',
                'circle-stroke-width': .74
            },
            'filter': ['>', 'max_tuition', 16001]
        });

        const popup = new maplibregl.Popup({
            closeButton: false,
            closeOnClick: false
        });

        let currentFeatureCoordinates = undefined;
 
        function addHoverPopup(layerId) {
            map.on('mousemove', layerId, (e) => {
                const featureCoordinates = e.features[0].geometry.coordinates.toString();
                if (currentFeatureCoordinates !== featureCoordinates) {
                    currentFeatureCoordinates = featureCoordinates;
                    map.getCanvas().style.cursor = 'pointer';

                    const coordinates = e.features[0].geometry.coordinates.slice();
                    const description = e.features[0].properties.schoolname;

                    while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                        coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                    }

                    popup.setLngLat(coordinates).setHTML(
                        `<h2>${description}</h2>
                        <p>Max Tuition: $${e.features[0].properties.max_tuition.toLocaleString()}</p>
                        <p>Total K-12 Enrollment: ${e.features[0].properties.tot_enrollment}</p>`
                    ).addTo(map);
                }
            });

            map.on('mouseleave', layerId, () => {
                currentFeatureCoordinates = undefined;
                map.getCanvas().style.cursor = '';
                popup.remove();
            });
        }

        ['school-low', 'school-med-low', 'school-med-high', 'school-high'].forEach(addHoverPopup);
    });

let schoolData = [];

fetch('schools.geojson')
    .then(res => res.json())
    .then(data => {
        schoolData = data.features;
    });

const searchBox = document.getElementById('searchBox');
const suggestions = document.getElementById('suggestions');

searchBox.addEventListener('input', () => {
    const query = searchBox.value.toLowerCase();
    suggestions.innerHTML = '';

    if (query.length < 2) {
        suggestions.style.display = 'none';
        return;
    }

    const matches = schoolData.filter(f => f.properties.schoolname.toLowerCase().includes(query));

    matches.forEach(match => {
        const li = document.createElement('li');
        li.textContent = match.properties.schoolname;
        li.style.padding = '8px 12px';
        li.style.cursor = 'pointer';
        li.addEventListener('click', () => {
            const [lng, lat] = match.geometry.coordinates;
            map.flyTo({ center: [lng, lat], zoom: 14, essential: true });
            suggestions.style.display = 'none';
            searchBox.value = match.properties.schoolname;
        });
        suggestions.appendChild(li);
    });

    suggestions.style.display = matches.length ? 'block' : 'none';
});


document.getElementById('resetBtn').addEventListener('click', () => {
    map.flyTo({
        center: [-93.21825738862282, 44.96882264809478], 
        zoom: 9,
        essential: true
    });
});


</script>
</body>
</html>
